<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Cube Rush</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: none;
}

body {
    overflow: hidden;
    background: #050510;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

/* =========================
   INTERFACE
========================= */

#ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    pointer-events: none;
}

#score {
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
}

#best {
    margin-top: 5px;
    font-size: 16px;
    opacity: 0.7;
}


/* =========================
   MENU / GAME OVER
========================= */

#menu,
#gameOver {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background:
        radial-gradient(
            circle,
            rgba(139,92,255,0.2),
            rgba(0,0,0,0.9)
        );

    z-index: 20;
    text-align: center;
}

#gameOver {
    display: none;
}

#menu h1,
#gameOver h1 {
    font-size: 58px;
    margin-bottom: 10px;

    text-shadow:
        0 0 20px #8b5cff,
        0 0 40px #8b5cff;
}

#menu p {
    opacity: 0.7;
    margin-bottom: 30px;
    font-size: 18px;
}

#gameOver p {
    font-size: 22px;
    margin-bottom: 25px;
}

button {
    border: none;
    border-radius: 14px;

    padding: 15px 35px;

    font-size: 20px;
    font-weight: bold;

    background: #8b5cff;
    color: white;

    cursor: pointer;

    box-shadow:
        0 0 20px rgba(139,92,255,0.6);

    transition: transform 0.1s;
}

button:active {
    transform: scale(0.95);
}


/* =========================
   CONTROLES MOBILE
========================= */

#controls {
    position: fixed;
    bottom: 25px;
    left: 0;

    width: 100%;

    display: flex;
    justify-content: space-between;

    padding: 0 25px;

    z-index: 15;
}

.control {
    width: 75px;
    height: 75px;

    border-radius: 20px;

    border:
        2px solid
        rgba(255,255,255,0.3);

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-size: 32px;

    display: flex;
    justify-content: center;
    align-items: center;

    user-select: none;
}

@media (min-width: 800px) {
    #controls {
        display: none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- =========================
     UI
========================= -->

<div id="ui">

    <div id="score">0 m</div>

    <div id="best">
        Record : 0 m
    </div>

</div>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <h1>Cube Rush</h1>

    <p>
        Va le plus loin possible !
    </p>

    <button onclick="startGame()">
        JOUER
    </button>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">

    <h1>GAME OVER</h1>

    <p id="finalScore">
        Score : 0 m
    </p>

    <button onclick="startGame()">
        REJOUER
    </button>

</div>


<!-- =========================
     CONTROLES
========================= -->

<div id="controls">

    <div
        class="control"
        id="left"
    >
        ◀
    </div>

    <div
        class="control"
        id="right"
    >
        ▶
    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;


function resize() {

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   VARIABLES DU JEU
===================================================== */

let player = null;

let obstacles = [];

let bonuses = [];

let particles = [];


let distance = 0;

let bonusScore = 0;

let score = 0;


let best =
    Number(
        localStorage.getItem(
            "cubeRushBest"
        )
    ) || 0;


let speed = 0;

let gameRunning = false;


let spawnTimer = 0;

let bonusTimer = 0;


/* =====================================================
   RECORD
===================================================== */

document.getElementById(
    "best"
).textContent =
    "Record : " +
    best +
    " m";


/* =====================================================
   CONTROLES
===================================================== */

let leftPressed = false;
let rightPressed = false;


/* =========================
   CLAVIER
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key === "a"
        ) {
            leftPressed = true;
        }

        if (
            e.key === "ArrowRight" ||
            e.key === "d"
        ) {
            rightPressed = true;
        }

        if (
            e.key === "ArrowUp" ||
            e.key === " " ||
            e.key === "w"
        ) {
            jump();
        }
    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key === "a"
        ) {
            leftPressed = false;
        }

        if (
            e.key === "ArrowRight" ||
            e.key === "d"
        ) {
            rightPressed = false;
        }
    }
);


/* =========================
   MOBILE
========================= */

const leftButton =
    document.getElementById("left");

const rightButton =
    document.getElementById("right");


leftButton.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        leftPressed = true;
    }
);


leftButton.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        leftPressed = false;
    }
);


leftButton.addEventListener(
    "touchcancel",
    function() {

        leftPressed = false;
    }
);


rightButton.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        rightPressed = true;
    }
);


rightButton.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        rightPressed = false;
    }
);


rightButton.addEventListener(
    "touchcancel",
    function() {

        rightPressed = false;
    }
);


/* =====================================================
   DEMARRER UNE PARTIE
===================================================== */

function startGame() {

    player = {

        x: W / 2 - 21,

        y: H - 150,

        size: 42,

        vx: 0,

        vy: 0,

        grounded: true
    };


    obstacles = [];

    bonuses = [];

    particles = [];


    distance = 0;

    bonusScore = 0;

    score = 0;


    /*
        Départ volontairement lent.
        Le jeu accélérera progressivement.
    */

    speed = 2;


    spawnTimer = 90;

    bonusTimer = 160;


    gameRunning = true;


    document.getElementById(
        "menu"
    ).style.display = "none";


    document.getElementById(
        "gameOver"
    ).style.display = "none";


    document.getElementById(
        "score"
    ).textContent = "0 m";
}


/* =====================================================
   SAUT
===================================================== */

function jump() {

    if (!gameRunning) {
        return;
    }


    if (player.grounded) {

        player.vy = -14;

        player.grounded = false;
    }
}


/* =====================================================
   CREER UN OBSTACLE
===================================================== */

function spawnObstacle() {

    /*
        Les obstacles ont maintenant
        des tailles différentes.
    */

    const width =
        35 +
        Math.random() * 75;


    const height =
        35 +
        Math.random() * 90;


    /*
        On garde une zone de sécurité
        autour de la piste.
    */

    const margin = 45;


    const x =
        margin +
        Math.random() *
        (
            W -
            margin * 2 -
            width
        );


    obstacles.push({

        x: x,

        y: -height,

        width: width,

        height: height
    });
}


/* =====================================================
   CREER UN BONUS
===================================================== */

function spawnBonus() {

    const size = 24;

    const margin = 50;


    const x =
        margin +
        Math.random() *
        (
            W -
            margin * 2 -
            size
        );


    bonuses.push({

        x: x,

        y: -size,

        size: size
    });
}


/* =====================================================
   PARTICULES
===================================================== */

function createParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (
                    Math.random()
                    - 0.5
                ) * 7,

            vy:
                (
                    Math.random()
                    - 0.5
                ) * 7,

            life: 30
        });
    }
}


/* =====================================================
   COLLISION RECTANGLE
===================================================== */

function collision(
    a,
    b
) {

    return (

        a.x <
        b.x + b.width

        &&

        a.x + a.size >
        b.x

        &&

        a.y <
        b.y + b.height

        &&

        a.y + a.size >
        b.y
    );
}


/* =====================================================
   UPDATE
===================================================== */

function update() {

    if (!gameRunning) {
        return;
    }


    /* ---------------------------------
       DEPLACEMENT
    --------------------------------- */

    if (leftPressed) {

        player.vx -= 0.8;
    }


    if (rightPressed) {

        player.vx += 0.8;
    }


    if (
        !leftPressed &&
        !rightPressed
    ) {

        player.vx *= 0.85;
    }


    player.vx =
        Math.max(
            -8,
            Math.min(
                8,
                player.vx
            )
        );


    player.x +=
        player.vx;


    /* ---------------------------------
       LIMITES
    --------------------------------- */

    const wall = 35;


    if (
        player.x <
        wall
    ) {

        player.x = wall;

        player.vx = 0;
    }


    if (
        player.x +
        player.size >
        W - wall
    ) {

        player.x =
            W -
            wall -
            player.size;

        player.vx = 0;
    }


    /* ---------------------------------
       GRAVITE
    --------------------------------- */

    player.vy += 0.7;

    player.y +=
        player.vy;


    const groundY =
        H - 150;


    if (
        player.y >=
        groundY
    ) {

        player.y =
            groundY;

        player.vy = 0;

        player.grounded =
            true;
    }


    /* ---------------------------------
       DISTANCE
    --------------------------------- */

    distance +=
        speed * 0.05;


    /*
        Le score est toujours :
        distance + bonus
    */

    score =
        Math.floor(distance)
        +
        bonusScore;


    document.getElementById(
        "score"
    ).textContent =
        score + " m";


    /* ---------------------------------
       ACCELERATION
    --------------------------------- */

    speed += 0.004;


    /*
        Vitesse maximale.
    */

    speed =
        Math.min(
            speed,
            12
        );


    /* ---------------------------------
       APPARITION OBSTACLES
    --------------------------------- */

    spawnTimer--;


    if (
        spawnTimer <= 0
    ) {

        spawnObstacle();


        /*
            Plus la vitesse augmente,
            plus les obstacles apparaissent.
        */

        spawnTimer =
            Math.max(
                35,
                105 -
                speed * 5
            );
    }


    /* ---------------------------------
       OBSTACLES
    --------------------------------- */

    for (
        let i =
        obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const obstacle =
            obstacles[i];


        obstacle.y +=
            speed;


        if (
            collision(
                player,
                obstacle
            )
        ) {

            gameOver();

            return;
        }


        if (
            obstacle.y >
            H + 100
        ) {

            obstacles.splice(
                i,
                1
            );
        }
    }


    /* ---------------------------------
       BONUS
    --------------------------------- */

    bonusTimer--;


    if (
        bonusTimer <= 0
    ) {

        spawnBonus();


        bonusTimer =
            180 +
            Math.random() * 100;
    }


    for (
        let i =
        bonuses.length - 1;

        i >= 0;

        i--
    ) {

        const bonus =
            bonuses[i];


        bonus.y +=
            speed;


        const bonusBox = {

            x: bonus.x,

            y: bonus.y,

            width: bonus.size,

            height: bonus.size
        };


        if (
            collision(
                player,
                bonusBox
            )
        ) {

            /*
                Bonus permanent de +10
                au score.
            */

            bonusScore += 10;


            createParticles(

                bonus.x +
                bonus.size / 2,

                bonus.y +
                bonus.size / 2
            );


            bonuses.splice(
                i,
                1
            );


            continue;
        }


        if (
            bonus.y >
            H + 50
        ) {

            bonuses.splice(
                i,
                1
            );
        }
    }


    /* ---------------------------------
       PARTICULES
    --------------------------------- */

    for (
        let i =
        particles.length - 1;

        i >= 0;

        i--
    ) {

        const particle =
            particles[i];


        particle.x +=
            particle.vx;

        particle.y +=
            particle.vy;


        particle.life--;


        if (
            particle.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning = false;


    createParticles(

        player.x +
        player.size / 2,

        player.y +
        player.size / 2
    );


    if (
        score >
        best
    ) {

        best =
            score;


        localStorage.setItem(
            "cubeRushBest",
            best
        );
    }


    document.getElementById(
        "finalScore"
    ).textContent =
        "Score : " +
        score +
        " m";


    document.getElementById(
        "best"
    ).textContent =
        "Record : " +
        best +
        " m";


    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";
}


/* =====================================================
   DESSIN
===================================================== */

function draw() {

    /*
        Fond
    */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#05051a"
    );


    gradient.addColorStop(
        1,
        "#17052e"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        Grille
    */

    ctx.strokeStyle =
        "rgba(120,80,255,0.15)";


    ctx.lineWidth = 1;


    const gridSize = 50;


    for (
        let x = 0;
        x < W;
        x += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    /*
        Piste
    */

    ctx.fillStyle =
        "#101020";


    ctx.fillRect(

        20,

        H - 200,

        W - 40,

        100
    );


    ctx.strokeStyle =
        "#8b5cff";


    ctx.lineWidth = 3;


    ctx.strokeRect(

        20,

        H - 200,

        W - 40,

        100
    );


    /*
        Obstacles
    */

    for (
        const obstacle
        of obstacles
    ) {

        ctx.fillStyle =
            "#ff2bd6";


        ctx.shadowBlur = 20;

        ctx.shadowColor =
            "#ff2bd6";


        ctx.fillRect(

            obstacle.x,

            obstacle.y,

            obstacle.width,

            obstacle.height
        );


        ctx.shadowBlur = 0;


        ctx.strokeStyle =
            "#ffffff";


        ctx.lineWidth = 2;


        ctx.strokeRect(

            obstacle.x,

            obstacle.y,

            obstacle.width,

            obstacle.height
        );
    }


    /*
        Bonus
    */

    for (
        const bonus
        of bonuses
    ) {

        ctx.save();


        ctx.translate(

            bonus.x +
            bonus.size / 2,

            bonus.y +
            bonus.size / 2
        );


        ctx.rotate(
            Date.now() * 0.003
        );


        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "#00ffff";


        ctx.fillStyle =
            "#00ffff";


        ctx.fillRect(

            -bonus.size / 2,

            -bonus.size / 2,

            bonus.size,

            bonus.size
        );


        ctx.shadowBlur = 0;


        ctx.restore();
    }


    /*
        Cube
    */

    if (player !== null) {

        ctx.save();


        ctx.translate(

            player.x +
            player.size / 2,

            player.y +
            player.size / 2
        );


        ctx.rotate(
            player.vx * 0.04
        );


        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "#8b5cff";


        ctx.fillStyle =
            "#8b5cff";


        ctx.fillRect(

            -player.size / 2,

            -player.size / 2,

            player.size,

            player.size
        );


        ctx.shadowBlur = 0;


        ctx.strokeStyle =
            "#ffffff";


        ctx.lineWidth = 2;


        ctx.strokeRect(

            -player.size / 2,

            -player.size / 2,

            player.size,

            player.size
        );


        ctx.restore();
    }


    /*
        Particules
    */

    for (
        const particle
        of particles
    ) {

        ctx.globalAlpha =
            particle.life / 30;


        ctx.fillStyle =
            "#8b5cff";


        ctx.fillRect(

            particle.x,

            particle.y,

            5,

            5
        );
    }


    ctx.globalAlpha = 1;
}


/* =====================================================
   BOUCLE PRINCIPALE
===================================================== */

function loop() {

    update();

    draw();

    requestAnimationFrame(
        loop
    );
}


loop();

</script>

</body>
</html>
